[workspace]
members = [
    "crates/fw-api",
    "crates/fw-cli",
    "crates/fw-compile",
    "crates/fw-devserver",
    "crates/fw-doc",
    "crates/fw-fixtures",
    "crates/fw-formats",
    "crates/fw-glyphdata",
    "crates/fw-geom",
    "crates/fw-layout",
    "crates/fw-model",
    "crates/fw-sfnt",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.94"

[workspace.dependencies]
read-fonts = { version = "0.43", features = ["experimental_traverse"] }
write-fonts = { version = "0.52", features = ["read"] }
skrifa = "0.46"
font-types = "0.12"
kurbo = { version = "0.13", features = ["serde"] }
flo_curves = "0.8"
i_overlay = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smol_str = { version = "0.3", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"
tokio-tungstenite = "0.29"
base64 = "0.22"
flate2 = "1"
woff2-patched = "0.4"
wuff = "0.2"
sha2 = "0.10"
criterion = "0.5"
assert_cmd = "2"
predicates = "3"
norad = { version = "0.18", features = ["kurbo", "rayon"] }
plist = "1"
proptest = "1"
walkdir = "2"
icu_properties = "=2.1.1"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

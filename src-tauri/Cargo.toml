[package]
name = "fontcarver"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The thin Tauri shell for FontCarver"

# The CLI in `fc-cli` owns the `fontcarver` binary name, so the desktop
# shell names its own binary explicitly; bundles are still "FontCarver"
# via `productName` in `tauri.conf.json`.
[[bin]]
name = "fontcarver-desktop"
path = "src/main.rs"

[lib]
name = "fontcarver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
fc-api = { path = "../crates/fc-api" }
fc-doc = { path = "../crates/fc-doc" }
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-fs.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }

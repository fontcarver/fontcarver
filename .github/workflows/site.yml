name: Site

# Separate from `ci.yml` on purpose: the website has no Rust, so it must not
# wait behind a 45-minute workspace build, and a change to the kernel must not
# redeploy the site.

on:
  push:
    paths:
      - 'site/**'
      - 'scripts/check_site.py'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/check_site.py'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build the site
        working-directory: site
        run: bun run build

      # The checker reads what the build produced, not the sources: a
      # generated page is the thing that gets served.
      - name: Check the site
        run: python3 scripts/check_site.py --root site/dist

      - name: Keep the built site
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: site/dist
          retention-days: 7

  deploy:
    needs: verify
    # Three conditions, all of which have to be arranged deliberately: a push
    # rather than a pull request, the default branch, and a repository
    # variable naming the Cloudflare Pages project. Until someone sets that
    # variable this job does not run, which is how "built but not published"
    # is enforced by the workflow instead of by memory.
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://fontcarver.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build the site
        working-directory: site
        run: bun run build

      - name: Check the site again against what is about to be published
        run: python3 scripts/check_site.py --root site/dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site/dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main

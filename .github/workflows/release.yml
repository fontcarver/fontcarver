name: Native installer candidates

# Builds remain reviewable artifacts. This workflow neither creates releases nor
# signs/notarizes public distributions. Native install checks use disposable CI.
on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "Installer formats to build: any comma-separated subset of deb, appimage, dmg, msi. Empty builds every platform's native formats."
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/*release*"
      - "scripts/release_licenses/**"
      - "scripts/check_artifacts.py"
      - "src-tauri/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "app/src/**"
      - "app/public/**"
      - "app/index.html"
      - "app/tsconfig*.json"
      - "app/vite.config.ts"
      - "app/package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "docs/install.md"
      - "docs/releasing.md"
      - "LICENSE-*"
      - "THIRD_PARTY.md"

permissions:
  contents: read

concurrency:
  group: native-installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A dispatch may narrow the formats, and no runner builds another platform's
  # package, so the matrix is resolved once here: an unknown format name fails
  # in seconds instead of after a 90-minute build, and a runner left with
  # nothing to build never starts.
  plan:
    name: Plan the native matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve the requested installer formats
        id: resolve
        shell: bash
        env:
          REQUESTED: ${{ inputs.bundles }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import os

          rows = [
              {"os": "ubuntu-22.04", "label": "linux-x86_64", "bundles": "deb,appimage"},
              {"os": "macos-14", "label": "macos-arm64", "bundles": "dmg"},
              {"os": "windows-2022", "label": "windows-x86_64", "bundles": "msi"},
          ]
          requested = [name.strip().lower()
                       for name in os.environ.get("REQUESTED", "").split(",") if name.strip()]
          known = {name for row in rows for name in row["bundles"].split(",")}
          unknown = sorted(set(requested) - known)
          if unknown:
              raise SystemExit("unknown installer formats: " + ", ".join(unknown)
                               + "; supported: " + ", ".join(sorted(known)))
          # Every accepted name belongs to some row and an empty request means
          # every row, so the plan is non-empty by construction once the names
          # above have been validated.
          plan = []
          for row in rows:
              native = row["bundles"].split(",")
              chosen = [name for name in native if name in requested] if requested else native
              if chosen:
                  plan.append(dict(row, bundles=",".join(chosen)))
          print("matrix=" + json.dumps(plan))
          PY

  native:
    name: ${{ matrix.label }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux bundle prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 \
            desktop-file-utils

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.94.0

      # Sources only, as in ci.yml: the release `target` directory is far too
      # large for the cache budget. This keeps a transient crates.io failure
      # from being the reason a three-platform packaging run goes red.
      - name: Cache the Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release checks
        run: python -m unittest discover -s scripts -p "test_*release*.py"

      - name: Build and inspect native installers
        run: python scripts/build_release.py --bundles ${{ matrix.bundles }} --min-free-gib 5

      - name: Install and remove Linux Debian package
        if: runner.os == 'Linux' && contains(matrix.bundles, 'deb')
        shell: bash
        run: |
          set -euo pipefail
          installers=()
          while IFS= read -r found; do installers+=("$found"); done \
            < <(find target/release/bundle/deb -maxdepth 1 -name '*.deb')
          test "${#installers[@]}" -eq 1
          installer="${installers[0]}"
          package="$(dpkg-deb -f "$installer" Package)"
          sudo apt-get install -y "./$installer"
          test -x /usr/bin/fontcarver-desktop
          test -s /usr/share/doc/"$package"/copyright
          # The installed executable has to load against the libraries APT just
          # resolved. There is no display, so it is pointed at an unreachable GTK
          # backend and only has to reach that check and exit.
          launch=0
          output="$(timeout --signal=KILL 120 env -u WAYLAND_DISPLAY \
            GDK_BACKEND=x11 DISPLAY=:99 /usr/bin/fontcarver-desktop 2>&1)" || launch=$?
          head -5 <<<"$output"
          test "$launch" -ne 137
          test "$launch" -ne 0
          while IFS= read -r desktop; do
            desktop-file-validate "$desktop"
          done < <(dpkg-query --listfiles "$package" | sed -n '/\.desktop$/p')
          dpkg-query --show "$package"
          sudo apt-get remove -y "$package"
          test ! -e /usr/bin/fontcarver-desktop

      # Package inspection proves the payload exists; this proves it loads. The
      # runner has no display, so the AppImage is pointed at a GTK backend it
      # cannot reach: a bundled runtime that is complete gets as far as the
      # display check and exits, and one that is broken fails earlier or hangs.
      - name: Smoke-test the AppImage runtime without a display
        if: runner.os == 'Linux' && contains(matrix.bundles, 'appimage')
        shell: bash
        run: |
          set -euo pipefail
          images=()
          while IFS= read -r found; do images+=("$found"); done \
            < <(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage')
          test "${#images[@]}" -eq 1
          status=0
          output="$(timeout --signal=KILL 120 env -u WAYLAND_DISPLAY \
            GDK_BACKEND=x11 DISPLAY=:99 "${images[0]}" 2>&1)" || status=$?
          head -5 <<<"$output"
          test "$status" -ne 137 || { echo "AppImage did not exit without a display"; exit 1; }
          test "$status" -ne 0 || { echo "AppImage reported success with no display"; exit 1; }

      # macOS runners still ship bash 3.2 for `shell: bash`, so this step keeps
      # to POSIX-era builtins: no `mapfile`, no associative arrays.
      - name: Install and remove macOS app from disk image
        if: runner.os == 'macOS' && contains(matrix.bundles, 'dmg')
        shell: bash
        run: |
          set -euo pipefail
          mount="$PWD/.scratch/p5-release-ci/mount"
          applications="$PWD/.scratch/p5-release-ci/Applications"
          mkdir -p "$mount" "$applications"
          images=()
          while IFS= read -r found; do images+=("$found"); done \
            < <(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg')
          test "${#images[@]}" -eq 1
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${images[0]}"
          detach() {
            for attempt in 1 2 3; do
              hdiutil detach "$mount" && return 0
              sleep 5
            done
            hdiutil detach -force "$mount"
          }
          trap 'detach || true' EXIT
          bundles=()
          while IFS= read -r found; do bundles+=("$found"); done \
            < <(find "$mount" -maxdepth 1 -name '*.app')
          test "${#bundles[@]}" -eq 1
          name="$(basename "${bundles[0]}")"
          ditto "${bundles[0]}" "$applications/$name"
          plutil -lint "$applications/$name/Contents/Info.plist"
          executable="$(plutil -extract CFBundleExecutable raw -o - \
            "$applications/$name/Contents/Info.plist")"
          test -x "$applications/$name/Contents/MacOS/$executable"
          detach
          trap - EXIT
          rm -rf "$PWD/.scratch/p5-release-ci"

      # No Windows package has ever been built, so this step is written to be
      # diagnosable on its first run: it names what it expected and lists what
      # the installer actually left behind.
      - name: Install and remove Windows MSI packages
        if: runner.os == 'Windows' && contains(matrix.bundles, 'msi')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .scratch/p5-release-ci | Out-Null
          $installers = @(Get-ChildItem -Path target/release/bundle/msi -Filter *.msi -File -ErrorAction SilentlyContinue)
          if ($installers.Count -lt 1) { throw "no MSI installer was produced" }
          # The installed executable's name has never been observed, since no
          # Windows package has been built. Rather than assert a guess, find the
          # single executable the installer placed and report what it is, the way
          # the macOS step reads CFBundleExecutable instead of assuming a name.
          $installed = Join-Path $env:ProgramFiles "FontCarver"
          foreach ($msi in $installers) {
            $log = Join-Path $PWD ".scratch/p5-release-ci/$($msi.BaseName).log"
            $removeLog = Join-Path $PWD ".scratch/p5-release-ci/$($msi.BaseName)-remove.log"
            $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /l*v `"$log`""
            if ($install.ExitCode -notin @(0, 3010)) { throw "MSI install failed: $($install.ExitCode); see $log" }
            if (-not (Test-Path -LiteralPath $installed)) {
              throw "install directory missing after a successful install: $installed; see $log"
            }
            $executables = @(Get-ChildItem -LiteralPath $installed -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue)
            if ($executables.Count -lt 1) {
              $present = (Get-ChildItem -LiteralPath $installed -Recurse -File -ErrorAction SilentlyContinue |
                ForEach-Object FullName) -join "; "
              throw "no executable under $installed. Present instead: $present"
            }
            Write-Host "installed executables: $(($executables | ForEach-Object Name) -join ', ')"
            # check_release_bundle.py expects this name inside the MSI payload, so
            # a mismatch here is the signal to correct that expectation.
            if (-not ($executables | Where-Object Name -eq 'fontcarver-desktop.exe')) {
              throw ("expected fontcarver-desktop.exe, which check_release_bundle.py also requires; " +
                     "found $(($executables | ForEach-Object Name) -join ', ') instead")
            }
            $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart /l*v `"$removeLog`""
            if ($uninstall.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed: $($uninstall.ExitCode); see $removeLog" }
            $left = @(Get-ChildItem -LiteralPath $installed -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue)
            if ($left.Count -gt 0) {
              throw "uninstall left $(($left | ForEach-Object FullName) -join '; ') behind"
            }
          }

      - name: Upload installers and inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: FontCarver-${{ matrix.label }}-${{ github.sha }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/release-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FontCarver-${{ matrix.label }}-failure-${{ github.sha }}
          path: |
            .scratch/p5-release-ci/*.log
            target/release/bundle/release-manifest.json
          if-no-files-found: ignore
          retention-days: 7

      # Hosted runners are disposable; retain the 20 GiB build/1 GiB scratch
      # ceilings with the documented 5 GiB free-space floor.
      - name: Check final artifact budget
        if: always()
        run: python scripts/check_artifacts.py --min-free-gib 5

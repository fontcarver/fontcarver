name: Native installer candidates

# Builds remain reviewable artifacts. This workflow neither creates releases nor
# signs/notarizes public distributions. Native install checks use disposable CI.
on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "Installer formats to build: any comma-separated subset of deb, rpm, appimage, dmg, nsis. Empty builds every platform's native formats."
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "src-tauri/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "app/src/**"
      - "app/public/**"
      - "app/index.html"
      - "app/tsconfig*.json"
      - "app/vite.config.ts"
      - "app/package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "docs/install.md"
      - "docs/releasing.md"
      - "LICENSE-*"
      - "THIRD_PARTY.md"

permissions:
  contents: read

concurrency:
  group: native-installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A dispatch may narrow the formats, and no runner builds another platform's
  # package, so the matrix is resolved once here: an unknown format name fails
  # in seconds instead of after a 90-minute build, and a runner left with
  # nothing to build never starts.
  plan:
    name: Plan the native matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve the requested installer formats
        id: resolve
        shell: bash
        env:
          REQUESTED: ${{ inputs.bundles }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import os

          rows = [
              {"os": "ubuntu-24.04", "label": "linux-x86_64", "bundles": "deb,rpm"},
              {"os": "macos-14", "label": "macos-arm64", "bundles": "dmg"},
              {"os": "windows-2022", "label": "windows-x86_64", "bundles": "nsis"},
          ]
          requested = [name.strip().lower()
                       for name in os.environ.get("REQUESTED", "").split(",") if name.strip()]
          known = {name for row in rows for name in row["bundles"].split(",")}
          unknown = sorted(set(requested) - known)
          if unknown:
              raise SystemExit("unknown installer formats: " + ", ".join(unknown)
                               + "; supported: " + ", ".join(sorted(known)))
          # Every accepted name belongs to some row and an empty request means
          # every row, so the plan is non-empty by construction once the names
          # above have been validated.
          plan = []
          for row in rows:
              native = row["bundles"].split(",")
              chosen = [name for name in native if name in requested] if requested else native
              if chosen:
                  plan.append(dict(row, bundles=",".join(chosen)))
          print("matrix=" + json.dumps(plan))
          PY

  native:
    name: ${{ matrix.label }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux bundle prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            desktop-file-utils gcc binutils pkg-config squashfs-tools rpm rpm2cpio cpio

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.94.0

      # Sources only, as in ci.yml: the release `target` directory is far too
      # large for the cache budget. This keeps a transient crates.io failure
      # from being the reason a three-platform packaging run goes red.
      - name: Cache the Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test scratch
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          scratch = Path('.scratch/p5-release-ci/tmp').resolve()
          scratch.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name in ('TMPDIR', 'TMP', 'TEMP'):
                  output.write(f'{name}={scratch}\n')
          PY

      - name: Test release checks
        if: runner.os != 'Linux'
        run: python -m unittest discover -s scripts -p "test_*release*.py"

      # AppImage inventory and isolated apt-install helpers are Linux-specific.
      - name: Test all packaging helpers on Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts -p "test_*.py"

      # These tests run on the native host but use a simulated DOM. They verify
      # platform modifier abstraction; they do not send desktop input.
      - name: Test platform shortcuts and window routing
        run: >-
          pnpm --dir app exec vitest run --maxWorkers=1 --minWorkers=1
          src/shell/shortcuts.test.ts src/shell/keymap.test.ts
          src/shell/keymapIntegration.test.ts src/shell/keymapPresets.test.ts
          src/editor/modifiers.test.ts src/transport/windows.test.ts

      - name: Build and inspect native installers
        run: python scripts/build_release.py --bundles ${{ matrix.bundles }} --min-free-gib 5

      - name: Install and remove Linux Debian package
        if: runner.os == 'Linux' && contains(matrix.bundles, 'deb')
        shell: bash
        run: |
          set -euo pipefail
          installers=()
          while IFS= read -r found; do installers+=("$found"); done \
            < <(find target/release/bundle/deb -maxdepth 1 -name '*.deb')
          test "${#installers[@]}" -eq 1
          installer="${installers[0]}"
          package="$(dpkg-deb -f "$installer" Package)"
          cleanup() {
            result=$?
            trap - EXIT
            sudo apt-get remove -y "$package" || result=1
            test ! -e /usr/bin/fontcarver-desktop || result=1
            exit "$result"
          }
          trap cleanup EXIT
          sudo apt-get install -y "./$installer"
          test -x /usr/bin/fontcarver-desktop
          test -s /usr/share/doc/"$package"/copyright
          python scripts/smoke_release_native.py --executable /usr/bin/fontcarver-desktop \
            --launch headless --report .scratch/p5-release-ci/deb-smoke.json
          while IFS= read -r desktop; do
            desktop-file-validate "$desktop"
          done < <(dpkg-query --listfiles "$package" | sed -n '/\.desktop$/p')
          dpkg-query --show "$package"

      # Package inspection proves the payload exists; this proves it loads. The
      # runner has no display, so the AppImage is pointed at a GTK backend it
      # cannot reach: a bundled runtime that is complete gets as far as the
      # display check and exits, and one that is broken fails earlier or hangs.
      - name: Smoke-test the AppImage runtime without a display
        if: runner.os == 'Linux' && contains(matrix.bundles, 'appimage')
        shell: bash
        run: |
          set -euo pipefail
          images=()
          while IFS= read -r found; do images+=("$found"); done \
            < <(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage')
          test "${#images[@]}" -eq 1
          python scripts/smoke_release_native.py --executable "${images[0]}" \
            --launch headless --report .scratch/p5-release-ci/appimage-smoke.json

      # macOS runners still ship bash 3.2 for `shell: bash`, so this step keeps
      # to POSIX-era builtins: no `mapfile`, no associative arrays.
      - name: Install and remove macOS app from disk image
        if: runner.os == 'macOS' && contains(matrix.bundles, 'dmg')
        shell: bash
        run: |
          set -euo pipefail
          mount="$PWD/.scratch/p5-release-ci/mount"
          applications="$PWD/.scratch/p5-release-ci/Applications"
          mkdir -p "$mount" "$applications"
          images=()
          while IFS= read -r found; do images+=("$found"); done \
            < <(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg')
          test "${#images[@]}" -eq 1
          attached=0
          detach() {
            for attempt in 1 2 3; do
              hdiutil detach "$mount" && return 0
              sleep 5
            done
            hdiutil detach -force "$mount"
          }
          cleanup() {
            result=$?
            trap - EXIT
            if test "$attached" -eq 1; then
              detach || result=1
            fi
            rm -rf "$applications" "$mount"
            exit "$result"
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${images[0]}"
          attached=1
          bundles=()
          while IFS= read -r found; do bundles+=("$found"); done \
            < <(find "$mount" -maxdepth 1 -name '*.app')
          test "${#bundles[@]}" -eq 1
          name="$(basename "${bundles[0]}")"
          ditto "${bundles[0]}" "$applications/$name"
          plutil -lint "$applications/$name/Contents/Info.plist"
          executable="$(plutil -extract CFBundleExecutable raw -o - \
            "$applications/$name/Contents/Info.plist")"
          test -x "$applications/$name/Contents/MacOS/$executable"
          detach
          attached=0
          python scripts/smoke_release_native.py \
            --executable "$applications/$name/Contents/MacOS/$executable" \
            --launch gui --report .scratch/p5-release-ci/macos-smoke.json

      # Runs before the NSIS step so the runner profile is still clean: the decisive
      # check is that WebView2 writes its state beside the executable and nothing
      # under %LOCALAPPDATA%, which only a real Windows WebView2 can show. Process
      # evidence only; it does not claim rendered UI readiness.
      - name: Run the Windows portable build from its extracted folder
        if: runner.os == 'Windows' && contains(matrix.bundles, 'nsis')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .scratch/p5-release-ci | Out-Null
          $archives = @(Get-ChildItem -Path target/release/bundle/portable -Filter *-portable.zip -File -ErrorAction SilentlyContinue)
          if ($archives.Count -ne 1) { throw "expected one portable zip, found $($archives.Count)" }
          $extract = Join-Path $env:RUNNER_TEMP "fontcarver-portable"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extract
          Expand-Archive -Path $archives[0].FullName -DestinationPath $extract
          $folders = @(Get-ChildItem -LiteralPath $extract -Directory)
          if ($folders.Count -ne 1) { throw "portable zip should hold one folder, found $($folders.Count)" }
          $root = $folders[0].FullName
          if (-not (Test-Path -LiteralPath (Join-Path $root "PORTABLE.txt"))) { throw "PORTABLE.txt missing beside the executable" }
          $profileData = Join-Path $env:LOCALAPPDATA "com.fontcarver.desktop"
          if (Test-Path -LiteralPath $profileData) { throw "runner profile already holds $profileData; this check needs a clean profile" }
          $report = ".scratch/p5-release-ci/portable-smoke.json"
          python scripts/smoke_release_native.py --executable (Join-Path $root "fontcarver-desktop.exe") --launch gui --report $report
          if ($LASTEXITCODE -ne 0) { throw "portable startup check failed; see $report" }
          $stored = @(Get-ChildItem -LiteralPath (Join-Path $root "data/webview") -Recurse -File -ErrorAction SilentlyContinue)
          if ($stored.Count -lt 1) { throw "portable run wrote no WebView data beside the executable" }
          if (Test-Path -LiteralPath $profileData) { throw "portable run wrote into the user profile: $profileData" }

      # One installer carries both locales now, so this is a single install,
      # bounded process startup and uninstall. Process evidence only; it does not
      # claim rendered UI readiness. NSIS takes /S for silent operation and writes
      # its own uninstall.exe into the install directory.
      - name: Install and remove the Windows NSIS package
        if: runner.os == 'Windows' && contains(matrix.bundles, 'nsis')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .scratch/p5-release-ci | Out-Null
          $installers = @(Get-ChildItem -Path target/release/bundle/nsis -Filter *-setup.exe -File -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) { throw "expected one NSIS installer, found $($installers.Count)" }
          $setup = $installers[0]
          # bundle.windows.nsis.installMode is perMachine, so this is the install root.
          $installed = Join-Path $env:ProgramFiles "FontCarver"
          $install = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList "/S"
          if ($install.ExitCode -ne 0) { throw "NSIS install failed: $($install.ExitCode)" }
          try {
            if (-not (Test-Path -LiteralPath $installed)) {
              throw "install directory missing after a successful install: $installed"
            }
            $executables = @(Get-ChildItem -LiteralPath $installed -Recurse -File -Filter fontcarver-desktop.exe -ErrorAction SilentlyContinue)
            if ($executables.Count -ne 1) {
              throw "expected one fontcarver-desktop.exe under $installed, found $($executables.Count)"
            }
            $report = ".scratch/p5-release-ci/$($setup.BaseName)-smoke.json"
            python scripts/smoke_release_native.py --executable $executables[0].FullName --launch gui --report $report
            if ($LASTEXITCODE -ne 0) { throw "native startup check failed; see $report" }
          } finally {
            $uninstaller = Join-Path $installed "uninstall.exe"
            if (Test-Path -LiteralPath $uninstaller) {
              $remove = Start-Process -FilePath $uninstaller -Wait -PassThru -ArgumentList "/S"
              if ($remove.ExitCode -ne 0) { throw "NSIS uninstall failed: $($remove.ExitCode)" }
            } else {
              throw "installer wrote no uninstall.exe into $installed"
            }
          }
          $left = @(Get-ChildItem -LiteralPath $installed -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue)
          if ($left.Count -gt 0) {
            throw "uninstall left $(($left | ForEach-Object FullName) -join '; ') behind"
          }

      - name: Upload installers and inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: FontCarver-${{ matrix.label }}-${{ github.sha }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*-setup.exe
            target/release/bundle/**/*-portable.zip
            target/release/bundle/release-manifest.json
            .scratch/p5-release-ci/*-smoke.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FontCarver-${{ matrix.label }}-failure-${{ github.sha }}
          path: |
            .scratch/p5-release-ci/*.log
            .scratch/p5-release-ci/*-smoke.json
            target/release/bundle/release-manifest.json
          if-no-files-found: ignore
          retention-days: 7

      # Hosted runners are disposable; retain the 20 GiB build/1 GiB scratch
      # ceilings with the documented 5 GiB free-space floor.
      - name: Check final artifact budget
        if: always()
        run: python scripts/check_artifacts.py --min-free-gib 5

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The whole job builds the Rust workspace twice over (clippy, then tests);
    # this bounds a hang well under GitHub's six-hour default.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt

      # Dependency sources only: the workspace's `target` directory is 4+ GB,
      # which costs more to upload and restore than it saves against GitHub's
      # per-repository cache budget.
      - name: Cache the Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Generate frontend API bindings
        run: cargo run -p fw-api --bin gen_ts

      - name: Install pnpm 10
        uses: pnpm/action-setup@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        working-directory: app
        run: pnpm check

      - name: Lint frontend
        working-directory: app
        run: pnpm lint

      - name: Check frontend formatting
        run: pnpm --dir app exec prettier --check .

      - name: Test frontend
        working-directory: app
        run: pnpm test

      - name: Build frontend
        working-directory: app
        run: pnpm build

      # The end-to-end suite starts `fw-devserver` and Vite itself, so the only
      # thing CI has to provide is the built binary and a browser. The CJK spec
      # skips: its corpus is a multi-megabyte font kept outside the repository.
      - name: Build the kernel development server
        run: cargo build -p fw-devserver

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install the Playwright browser
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: app
        timeout-minutes: 20
        run: pnpm e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
          if-no-files-found: ignore
